<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml"
  xmlns:o="urn:schemas-microsoft-com:office:office">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{{title}}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>

<body
  style="margin:0;padding:0;width:100%;background-color:#F9FAFB;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <div style="display:none;max-height:0;overflow:hidden;">__PREHEADER__</div>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
    style="border-collapse:collapse;background-color:#F9FAFB;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600"
          style="border-collapse:collapse;max-width:600px;width:100%;background-color:#FFFFFF;border-radius:12px;box-shadow:0 1px 3px 0 rgba(0,0,0,0.1),0 1px 2px -1px rgba(0,0,0,0.1);">
          <tr>
            <td style="padding:40px 40px 24px 40px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                style="border-collapse:collapse;">
                <tr>
                  <td align="center" style="padding:0 0 28px 0;">
                    <img src="__LOGO_URL__" alt="Car Comfort" width="200" height="auto"
                      style="display:block;max-width:200px;height:auto;margin:0 auto;border:0;outline:none;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#111827;" />
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding:0 0 16px 0;">
                    <h1
                      style="margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:700;line-height:1.3;color:#111827;text-align:center;">
                      {{title}}</h1>
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding:0 0 28px 0;">
                    <p
                      style="margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#4B5563;text-align:center;max-width:520px;">
                      {{message}}</p>
                  </td>
                </tr>
                __CODE_BLOCK__
                <tr>
                  <td align="center" style="padding:16px 0 0 0;">
                    <div
                      style="margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;color:#4B5563;text-align:center;width:100%;">
                      {{footer}}</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="border-top:1px solid #E5E7EB;padding:24px 40px 32px 40px;">
              <p
                style="margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#9CA3AF;text-align:center;">
                Car Comfort — Seamless EV charging and car wash services in one place.</p>
              <p
                style="margin:8px 0 0 0;padding:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#9CA3AF;text-align:center;">
                &copy; __YEAR__ Car Comfort. All rights reserved.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>

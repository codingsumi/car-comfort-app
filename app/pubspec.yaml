name: car_comfort
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.1+16

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  # Keep Android Maps/Common native binaries aligned with Navigation SDK 3.24.3.
  mapbox_maps_flutter: 2.24.3
  cupertino_icons: ^1.0.8
  get_cli: ^1.9.1
  flutter_gen: ^5.9.0
  get: ^4.7.3
  dio: ^5.9.1
  package_info_plus: ^9.0.0
  # Pin: 12.4.0+ uses NSProcessInfo.isiOSAppOnVision (iOS 26.1 SDK) and fails on older Xcode.
  device_info_plus: 12.3.0
  url_launcher: ^6.3.2
  video_player: ^2.10.1
  video_thumbnail: ^0.5.3
  onesignal_flutter: ^5.4.1
  intl: ^0.20.2
  fluttertoast: ^9.0.0
  flutter_timezone: ^5.0.1
  permission_handler: ^12.0.1
  geolocator: ^13.0.2
  flutter_svg: ^2.2.3
  flutter_slidable: ^3.1.1
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.4.1
  dropdown_button2: ^2.3.9
  image_picker: ^1.2.1
  flutter_spinkit: ^5.2.2
  flutter_dotenv: ^6.0.0
  flutter_html: ^3.0.0
  get_storage: ^2.1.1
  flutter_secure_storage: ^9.2.2
  adaptive_theme: ^3.7.2
  connectivity_plus: ^7.0.0
  toastification: ^3.0.3
  url_strategy: ^0.3.0
  country_code_picker_plus: ^0.1.0+1
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  file_picker: ^11.0.2
  syncfusion_flutter_pdfviewer: ^33.1.49
  open_filex: ^4.7.0
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^7.0.1
  flutter_facebook_auth: ^7.1.2
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.6
  flutter_stripe: ^12.6.0
  uuid: ^4.5.3
  socket_io_client: ^3.1.4
  share_plus: ^12.0.1
  firebase_database: ^12.4.6
  app_links: ^7.0.0
  # Pin below 12.x: v12 needs TOCropViewController 3.x but file_picker's
  # DKImagePickerController requires TOCropViewController 2.x (SPM conflict).
  image_cropper: ^11.0.0
  path_provider: ^2.1.5
  flutter_image_compress: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  analyzer: 6.4.1
  build_runner: ^2.4.8
  change_app_package_name: ^1.1.0
  flutter_gen_runner: ^5.4.0
  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^6.0.0
  json_serializable: ^6.8.0
  lints: ^6.0.0
  rename_app: ^1.6.1

# iOS simulator: path_provider_foundation 2.6.0 + objective_c 9.4.x fails to load
# objective_c.framework (DOBJC_initializeApi). Pin until Flutter tooling fix ships.
dependency_overrides:
  objective_c: 9.3.0
  path_provider_foundation: 2.5.1


flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/gif/
    - assets/launcher/
    - .env

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_thin.ttf
          weight: 100
        - asset: assets/fonts/inter_extralight.ttf
          weight: 200
        - asset: assets/fonts/inter_light.ttf
          weight: 300
        - asset: assets/fonts/inter_regular.ttf
          weight: 400
        - asset: assets/fonts/inter_medium.ttf
          weight: 500
        - asset: assets/fonts/inter_semibold.ttf
          weight: 600
        - asset: assets/fonts/inter_bold.ttf
          weight: 700
        - asset: assets/fonts/inter_extrabold.ttf
          weight: 800
        - asset: assets/fonts/inter_black.ttf
          weight: 900

flutter_gen:
  output: lib/app/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)
  assets:
    outputs:
      style: camel-case

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/launcher/app_icon.png"
  image_path_ios: "assets/launcher/app_icon_ios.png"
  image_path_android: "assets/launcher/app_icon.png"
  adaptive_icon_background: "#082A4D"
  adaptive_icon_foreground: "assets/launcher/app_icon.png"
  adaptive_icon_foreground_inset: 0

get_cli:
  sub_folder: false
